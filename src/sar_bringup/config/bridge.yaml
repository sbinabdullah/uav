# ros_gz_bridge endpoint config for the sar_zone world.
# NOTE: the gz topic contains the spawned model instance name
# (x500_mono_cam_down_0). If the airframe/model changes, update it here.
- ros_topic_name: /camera/image_raw
  gz_topic_name: /world/sar_zone/model/x500_mono_cam_down_0/link/camera_link/sensor/camera/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  subscriber_queue: 5
  publisher_queue: 5
  lazy: false
  direction: GZ_TO_ROS

- ros_topic_name: /camera/camera_info
  gz_topic_name: /world/sar_zone/model/x500_mono_cam_down_0/link/camera_link/sensor/camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  subscriber_queue: 5
  publisher_queue: 5
  lazy: false
  direction: GZ_TO_ROS

- ros_topic_name: /clock
  gz_topic_name: /world/sar_zone/clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  subscriber_queue: 5
  publisher_queue: 5
  lazy: false
  direction: GZ_TO_ROS
